<div class="fondo" (click)="cancelar.emit()">
  <div class="tarjeta" (click)="$event.stopPropagation()">
    <h3>{{ titulo() }}</h3>
    @if (mensaje()) {
      <p>{{ mensaje() }}</p>
    }
    <div class="acciones">
      <button class="btn-cancelar" (click)="cancelar.emit()">Cancelar</button>
      <button class="btn-confirmar" (click)="confirmar.emit()">{{ textoConfirmar() }}</button>
    </div>
  </div>
</div>
