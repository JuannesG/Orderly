<div class="login-page">
  <div class="panel-imagen">
    <div class="overlay">
      <img src="/assets/logo-mr-lucho.png" alt="Mr Lucho" class="logo-login">
      <p>Panel de administración</p>
    </div>
  </div>

  <div class="panel-form">
    <span class="decoracion d1">🧑‍🍳</span>
    <span class="decoracion d2">🍔</span>
    <span class="decoracion d3">🍟</span>
    <span class="decoracion d4">🔥</span>

    <div class="form-contenedor">
      <h1><span class="icono-titulo">👨‍🍳</span> Iniciar sesión</h1>
      <p class="subtitulo">Accede a tu cuenta para continuar</p>

      <form (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="username">Usuario</label>
          <input id="username" type="text" name="username" [(ngModel)]="username" required />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" [(ngModel)]="password" required />
        </div>

        <button type="submit">Ingresar</button>

        @if (error) {
        <p class="error-message">{{ error }}</p>
        }
      </form>
    </div>
  </div>
</div>
