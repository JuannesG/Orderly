<div class="login-page">
  <div class="login-card">
    <img src="/assets/logo-mr-lucho.png" alt="Mr Lucho" class="login-logo">

    <h1>Panel de restaurante</h1>
    <p class="subtitulo">Inicia sesión para continuar</p>

    <form (ngSubmit)="onSubmit()">
      <div class="campos">
        <div class="input-icono">
          <svg lucideUser [size]="18"></svg>
          <input id="username" type="text" name="username" autocomplete="username"
            placeholder="Usuario" aria-label="Usuario" [(ngModel)]="username" required />
        </div>

        <div class="input-icono">
          <svg lucideLock [size]="18"></svg>
          <input id="password" name="password" autocomplete="current-password"
            placeholder="Contraseña" aria-label="Contraseña"
            [type]="mostrarClave ? 'text' : 'password'" [(ngModel)]="password" required />
          <button type="button" class="ver-clave"
            [attr.aria-label]="mostrarClave ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            (click)="mostrarClave = !mostrarClave">
            @if (mostrarClave) {
              <svg lucideEyeOff [size]="18"></svg>
            } @else {
              <svg lucideEye [size]="18"></svg>
            }
          </button>
        </div>
      </div>

      @if (error) {
        <p class="error-message">
          <svg lucideCircleAlert [size]="18"></svg>
          <span>{{ error }}</span>
        </p>
      }

      <button type="submit" class="btn-ingresar" [disabled]="cargando">
        <svg lucideLogIn [size]="18"></svg>
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>

      @if (cargando) {
        <p class="espera">Si el servidor estaba dormido, puede tardar hasta un minuto.</p>
      }
    </form>
  </div>

  <p class="pie">Mr.Lucho</p>
</div>
