<div class="panel-pedidos">
  @if (verDomicilios && verLocal) {
    <div class="pestanas">
      <button [class.activo]="pestana === 'domicilios'" (click)="pestana = 'domicilios'">
        <svg lucideBike [size]="20"></svg>
        Domicilios
      </button>
      <button [class.activo]="pestana === 'local'" (click)="pestana = 'local'">
        <svg lucideStore [size]="20"></svg>
        En el local
      </button>
    </div>
  }

  @if (pestana === 'domicilios') {
    <app-lista-pedidos />
  } @else {
    <app-pedidos-local />
  }
</div>
