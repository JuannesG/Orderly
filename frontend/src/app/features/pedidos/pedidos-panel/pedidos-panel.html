<div class="panel-pedidos">
  @if (verDomicilios && verLocal) {
    <div class="pestanas">
      <button [class.activo]="pestana === 'domicilios'" (click)="pestana = 'domicilios'">Domicilios</button>
      <button [class.activo]="pestana === 'local'" (click)="pestana = 'local'">En el local</button>
    </div>
  }

  @if (pestana === 'domicilios') {
    <app-lista-pedidos />
  } @else {
    <app-pedidos-local />
  }
</div>
