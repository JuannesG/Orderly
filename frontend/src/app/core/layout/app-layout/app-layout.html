<div class="layout">
  <header class="top-admin">
    <img src="/assets/logo-mr-lucho.png" alt="Mr Lucho" class="logo-top">
    <span>Panel de restaurante</span>
  </header>

  <main class="contenido">
    <router-outlet></router-outlet>
  </main>

  <nav class="nav-admin">
        @if (esDueno) {
      <a routerLink="/dashboard" routerLinkActive="activo"><span class="ico"><svg lucideHouse [size]="22"></svg></span><span>Inicio</span></a>
      <a routerLink="/menu" routerLinkActive="activo"><span class="ico"><svg lucideBookOpen [size]="22"></svg></span><span>Menú</span></a>
    }
    @if (veDomicilios || veLocal) {
      <a routerLink="/pedidos" routerLinkActive="activo"><span class="ico"><svg lucideClipboardList [size]="22"></svg></span><span>Pedidos</span></a>
    }
    @if (veLocal) {
      <a routerLink="/mesera" routerLinkActive="activo"><span class="ico"><svg lucideUtensils [size]="22"></svg></span><span>Tomar pedido</span></a>
    }
    @if (esDueno) {
      <a routerLink="/reservas" routerLinkActive="activo"><span class="ico"><svg lucideCalendarDays [size]="22"></svg></span><span>Reservas</span></a>
    }
    <button (click)="cerrarSesion()"><span class="ico"><svg lucideLogOut [size]="22"></svg></span><span>Salir</span></button>
  </nav>
</div>
