<div class="layout">
  <header class="top-admin">
    <div class="marca">
      <img src="/assets/logo-mr-lucho.png" alt="Mr Lucho" class="logo-top">
      <span class="titulo">Panel de restaurante</span>
    </div>
    <div class="usuario">
      <span class="avatar"><svg lucideUser [size]="20"></svg></span>
      <div class="usuario-datos">
        <span class="usuario-nombre">{{ nombre }}</span>
        <span class="usuario-rol">{{ rolEtiqueta }}</span>
      </div>
    </div>
  </header>

  <main class="contenido">
    <router-outlet></router-outlet>
  </main>

  <nav class="nav-admin">
    @if (esDueno) {
    <a routerLink="/dashboard" routerLinkActive="activo"><span class="ico"><svg lucideHouse
          [size]="22"></svg></span><span>Inicio</span></a>
    <a routerLink="/menu" routerLinkActive="activo"><span class="ico"><svg lucideBookOpen
          [size]="22"></svg></span><span>Menú</span></a>
    }
    @if (veDomicilios || veLocal) {
    <a routerLink="/pedidos" routerLinkActive="activo"><span class="ico"><svg lucideClipboardList
          [size]="22"></svg></span><span>Pedidos</span></a>
    }
    @if (veLocal) {
    <a routerLink="/mesera" routerLinkActive="activo"><span class="ico"><svg lucideUtensils
          [size]="22"></svg></span><span>Tomar pedido</span></a>
    }

    <button type="button" class="btn-mas" [class.activo]="masAbierto || enSecundaria"
      [attr.aria-expanded]="masAbierto" (click)="alternarMas()">
      <span class="ico"><svg lucideEllipsis [size]="22"></svg></span><span>Más</span>
    </button>

    <div class="grupo-mas" [class.abierto]="masAbierto">
      @if (esDueno) {
      <a routerLink="/reservas" routerLinkActive="activo"><span class="ico"><svg lucideCalendarDays
            [size]="22"></svg></span><span>Reservas</span></a>
      <a routerLink="/estadisticas" routerLinkActive="activo"><span class="ico"><svg lucideChartColumn
            [size]="22"></svg></span><span>Estadísticas</span></a>
      <a routerLink="/equipo" routerLinkActive="activo"><span class="ico"><svg lucideUsers
            [size]="22"></svg></span><span>Equipo</span></a>
      }
      <button type="button" class="btn-salir" (click)="cerrarSesion()"><span class="ico"><svg lucideLogOut
            [size]="22"></svg></span><span>Salir</span></button>
    </div>
  </nav>

  @if (masAbierto) {
  <div class="fondo-mas" (click)="cerrarMas()"></div>
  }
</div>
